<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos - Igreja Católica</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-amber-700 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">Roteiro de Estudos Católicos</h1>
        <p class="text-sm mt-2 font-light">Baseado no Catecismo Romano e no Concílio de Trento</p>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-5xl">
        
        <div id="painel-identificacao" class="bg-white p-6 rounded-lg shadow-md mb-6 max-w-md mx-auto mt-10">
            <h2 class="text-xl font-semibold mb-4 text-center text-amber-800">Acesse sua Conta</h2>
            <div class="flex flex-col gap-4">
                <div>
                    <label for="input-usuario" class="text-sm font-medium text-gray-700 block mb-1">Usuário:</label>
                    <input type="text" id="input-usuario" placeholder="Seu usuário aqui..." class="border p-2 rounded w-full focus:outline-amber-600 text-sm">
                </div>
                
                <div>
                    <label for="input-senha" class="text-sm font-medium text-gray-700 block mb-1">Senha:</label>
                    <input type="password" id="input-senha" placeholder="Sua senha aqui..." class="border p-2 rounded w-full focus:outline-amber-600 text-sm">
                </div>
                
                <div class="flex gap-2 mt-2">
                    <button id="btn-login" class="flex-1 bg-amber-700 hover:bg-amber-800 text-white px-4 py-2 rounded font-medium transition cursor-pointer text-sm">Entrar</button>
                    <button id="btn-cadastro" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded font-medium transition cursor-pointer text-sm">Cadastrar</button>
                </div>

                <p id="mensagem-feedback" class="text-xs text-center font-medium mt-1 hidden"></p>
            </div>
        </div>

        <div id="painel-principal" class="hidden grid grid-cols-1 md:grid-cols-4 gap-6 mt-4">
            <div class="bg-white p-4 rounded-lg shadow-md md:col-span-1 h-fit">
                <h3 class="font-bold text-lg mb-3 border-b pb-2 text-amber-800">O que quer aprender?</h3>
                <ul class="space-y-1">
                    <li><button onclick="carregarSubMenu(1)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">1. O Credo</button></li>
                    <li><button onclick="carregarSubMenu(2)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">2. Os Sacramentos</button></li>
                    <li><button onclick="carregarSubMenu(3)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">3. O Decálogo</button></li>
                    <li><button onclick="carregarSubMenu(4)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">4. A Oração</button></li>
                    <li><button onclick="carregarSubMenu(5)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">5. Os Dogmas</button></li>
                    <li><button onclick="carregarSubMenu(6)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition">6. Tradição, Escritura...</button></li>
                    <li><button onclick="carregarSubMenu(7)" class="w-full text-left p-2 text-sm hover:bg-amber-50 rounded transition font-medium text-amber-900">7. O que é a Igreja?</button></li>
                    <li class="pt-4 border-t border-gray-100"><button onclick="mostrarConsideracoes()" class="w-full text-left p-2 text-xs bg-gray-50 hover:bg-gray-100 rounded text-gray-500">8. Informações do Sistema</button></li>
                </ul>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md md:col-span-3">
                <h2 id="saudacao-usuario" class="text-xl font-bold text-amber-700 mb-4"></h2>
                
                <div id="sub-menu-container" class="flex flex-wrap gap-2 mb-4"></div>
                
                <hr class="my-4 border-gray-100">

                <div id="caixa-texto" class="prose max-w-none">
                    <h3 id="texto-titulo" class="text-xl font-bold mb-3 text-gray-800">Selecione um tópico ao lado para começar!</h3>
                    <p id="texto-conteudo" class="text-gray-600 leading-relaxed text-justify whitespace-pre-line"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center p-4 text-xs mt-10">
        <p>Fontes: Catecismo de Trento (1566) | Ineffabilis Deus | Mystici Corporis Christi</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
