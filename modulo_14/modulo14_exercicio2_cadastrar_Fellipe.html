<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card mx-auto shadow" style="max-width: 500px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Cadastrar Novo Produto</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" name="nome" class="form-control" required placeholder="Ex: Teclado Mecânico">
                </div>
                <div class="mb-3">
                    <label class="form-label">Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" class="form-control" required placeholder="0.00">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantidade em Estoque</label>
                    <input type="number" name="quantidade" class="form-control" required placeholder="0">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-success">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
